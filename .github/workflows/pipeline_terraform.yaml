name: Terraform CI

on:
  push:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/pipeline_terraform.yaml'
  pull_request:
    paths:
      - 'infra/terraform/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Check formatting
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Init (no backend, no AWS credentials needed)
        run: terraform -chdir=infra/terraform init -backend=false

      - name: Validate
        run: terraform -chdir=infra/terraform validate

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra/terraform
          # This is a first pass wiring up CI, not an infra security audit: the
          # existing modules have pre-existing findings (e.g. Lambda tracing,
          # some encryption defaults) that need a deliberate look before
          # changing live resources. Soft-fail so they're visible without
          # blocking every PR until each one is triaged.
          soft_fail: true
