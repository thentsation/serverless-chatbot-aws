name: Docker CI/CD

on:
  workflow_run:
    workflows: ["Python CI"]
    types: [completed]
  pull_request:
    paths:
      - 'infra/lambdas/orchestrator/**'
  schedule:
    - cron: "0 11 * * *" # 08:00 BRT (UTC-3)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Lambda image
        run: |
          docker build -t serverless-chatbot-orchestrator:latest infra/lambdas/orchestrator

      - name: Export image for scanning
        run: docker save serverless-chatbot-orchestrator:latest -o /tmp/image.tar

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/image.tar
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: usr/local/lib/python*/site-packages/pip/_vendor
          exit-code: '1'
