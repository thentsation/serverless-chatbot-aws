[tool.semantic_release]
tag_format = 'v{version}'
commit_message = 'chore(release): v{version} [skip ci]'

[tool.semantic_release.branches.main]
match = 'main'

[tool.ruff]
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
# BLE001: the Lambda handler and its outer helpers must never raise - they
# always return a structured {"success": False, "error": ...} response.
ignore = ["BLE001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["infra/lambdas/orchestrator"]
mypy_path = "infra/lambdas/orchestrator"
explicit_package_bases = true
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.':"]
